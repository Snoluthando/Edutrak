<!DOCTYPE html> 
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <style>
      body {
  background: url("https://media.istockphoto.com/id/862661268/photo/the-student-life.jpg?s=612x612&w=0&k=20&c=CAh6DqO_QnmuPkgvfb963q-TEEnRKd0HOl8oU3YotsU=") 
              no-repeat center center fixed;
  background-size: cover; /* Ensures the image fills the entire page */
  color: #2DD4BF;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

      .register-container {
        background: rgba(0, 0, 0, 0.496);
        backdrop-filter: blur(5px);
        padding: 40px;
        border-radius: 15px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.463);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .register-container h2 { 
  text-align: center;
  margin-bottom: 30px;
  font-weight: 600;
  color: #26514c;

  /* FIXES */
  backdrop-filter: none !important;  
  background: transparent !important; 
  box-shadow: none !important;        
  border: none !important;            
}

      .form-control {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #26514c;
        padding: 12px;
      }
      .form-control:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: #000000;
        color: #000000;
        box-shadow: 0 0 0 0.2rem #00f1dd32;
      }
      .form-control::placeholder {
        color: rgba(0, 0, 0, 0.861);
      }
      .btn-outline-success {
        border-color: #26514c;
        color: #26514c;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-outline-success:hover {
        background-color: #26514c;
        border-color: #26514c;
        color: #000;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.829);
      }
      .text-white-50 {
        text-align: center;
        font-size: 0.9rem;
        color: #000000;
      }

      .text-light {
        color: #26514c !important;
        text-decoration: none;
        font-weight: 600;
      }
      .text-light:hover {
        color: #26514c !important;
        text-decoration: underline;
      }

      .text-Dark {
        color: #000000 !important;
        text-decoration: none;
        font-weight: 400;
      }
    </style>

    <div class="register-container">
      <h2>📚 Student Registration</h2>
      <form id="registerForm">
        <!-- FULL NAME FIELD -->
        <div class="mb-3">
          <input
            type="text"
            id="fullName"
            class="form-control"
            placeholder="Full Name"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="text"
            id="studentNumber"
            class="form-control"
            placeholder="Student Number (2025001-2025999)"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password (min 6 characters)"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Confirm Password"
            required
          />
        </div>
        <button type="submit" class="btn btn-outline-success w-100">
          Register
        </button>
        <p class="text-Dark">
          Already registered? <a href="login.html" class="text-light">Login here</a>
        </p>
      </form>
    </div>

    <script>
      function buf2hex(buffer) {
        const bytes = new Uint8Array(buffer);
        return Array.from(bytes)
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      async function hashPassword(password) {
        const enc = new TextEncoder();
        const data = enc.encode(password);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return buf2hex(hashBuffer);
      }

      function getStudents() {
        const raw = localStorage.getItem("students");
        return raw ? JSON.parse(raw) : [];
      }

      function setStudents(students) {
        localStorage.setItem("students", JSON.stringify(students));
      }

      document.getElementById("registerForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const fullName = document.getElementById("fullName").value.trim();
        const studentNumber = document.getElementById("studentNumber").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!fullName) {
          alert("⚠️ Please enter your full name.");
          return;
        }

        const studentNumberNum = Number(studentNumber);
        if (!studentNumber || studentNumberNum < 2025001 || studentNumberNum > 2025999) {
          alert("⚠️ Invalid student number. Must be between 2025001 and 2025999.");
          return;
        }

        if (password.length < 6) {
          alert("⚠️ Password must be at least 6 characters long.");
          return;
        }

        if (password !== confirmPassword) {
          alert("⚠️ Passwords do not match.");
          return;
        }

        const students = getStudents();
        if (students.some((s) => s.studentNumber === studentNumber)) {
          alert("❌ Registration unsuccessful! Student number already exists.");
          return;
        }

        try {
          const passwordHash = await hashPassword(password);

          const newStudent = {
            fullName,
            studentNumber,
            password: passwordHash,
            createdAt: new Date().toISOString(),
          };

          students.push(newStudent);
          setStudents(students);


          alert("✅ Registration successful! Redirecting to login...");
          window.location.href = "login.html";
        } catch (err) {
          console.error(err);
          alert("❌ Error creating account. Please try again.");
        }
      });
    </script>
  </body>
</html>

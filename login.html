<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTrak Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("https://media.istockphoto.com/id/1363276509/photo/teacher-giving-computer-science-lecture-to-diverse-multiethnic-group-of-female-and-male.jpg?s=612x612&w=0&k=20&c=iHDI7pI98XJfh95nFw-wT9L9jYr0IzSBYB53riWOVsk=") 
                  no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }
    .login-container {
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      z-index: 1;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: #26514c;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px;
    }
    .form-control:focus {
      background: rgba(13, 163, 133, 0);
      border-color: #26514c;
      color: white;
      box-shadow: 0 0 0 0.2rem rgb(255, 255, 255);
    }
    .form-control::placeholder {
      color: rgba(255,255,255,0.6);
    }
    .btn-outline-success {
      border-color: #26514c;
      color: #F3F4F6;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-outline-success:hover {
      background-color: #26514c;
      border-color: #ffffff;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74,222,128,0.4);
    }
    .text-white-50 { text-align:center; font-size:0.9rem;}
    .text-light { color:#26514c !important; text-decoration:none; font-weight:600;}
    .text-light:hover { color:#084540 !important; text-decoration:underline;}
  </style>
</head>
<body>
<div class="login-container">
  <h2>Student Login</h2>
  <form id="loginForm">
    <div class="mb-3">
      <input type="text" id="studentNumber" class="form-control form-control-lg" placeholder="Enter Student Number" required>
    </div>
    <div class="mb-3">
      <input type="password" id="password" class="form-control form-control-lg" placeholder="Enter Password" required>
    </div>
    <button type="submit" class="btn btn-outline-success btn-lg w-100" ><a href="Dashboard.html" class="text-light"></a>Login</button>
    <p class="mt-3 text-white-50">Don't have an account? <a href="register.html" class="text-light">Register here</a></p>
  </form>
</div>

<script>
  async function buf2hex(buffer) {
    const bytes = new Uint8Array(buffer);
    return Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function hashPassword(password) {
    const enc = new TextEncoder();
    const data = enc.encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return buf2hex(hashBuffer);
  }

  document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    const studentNumber = document.getElementById("studentNumber").value.trim();
    const password = document.getElementById("password").value;

    const students = JSON.parse(localStorage.getItem("students")) || [];
    const passwordHash = await hashPassword(password);

    const user = students.find(s => s.studentNumber === studentNumber && s.password === passwordHash);

    if(user){
      localStorage.setItem("currentUser", JSON.stringify(user));
      alert(`✅ Login Successful! Welcome, Student ${user.studentNumber}.`);
      window.location.href = "Dashboard.html";
    } else {
      alert("❌ Invalid Credentials! Please check your student number and password.");
    }
  });
</script>
</body>
</html>
